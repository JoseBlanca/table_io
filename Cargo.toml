[workspace]
resolver = "3"
members = ["crates/table_io", "crates/table_io_js"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/JoseBlanca/table_io"

# The lint table of .claude/skills/coding/lints.toml, where each lint has its
# reason; each crate takes it with `[lints] workspace = true`.

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
fallible_impl_from = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
wildcard_enum_match_arm = "deny"
fn_params_excessive_bools = "deny"
match_same_arms = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes_without_reason = "deny"

[profile.release]
# As measured in popnei_web's docs/technology.md, section 2.
opt-level = 3
lto = true
codegen-units = 1

[profile.dev.package.calamine]
# calamine adds and subtracts row and column numbers with plain operators,
# which panic in a build with overflow checks and wrap in the release build
# of the package; off here too, the builds of the tests among them, so that
# a test of a damaged file meets what the package does
# (docs/architecture.md, section 6).
overflow-checks = false

[profile.dev.package."*"]
# The dependencies, calamine, zip and quick-xml among them, optimized in
# the builds of the tests: the no-panic test of docs/specs/import.md
# imports 1,470,000 copies of an xlsx and a CSV, which took 108 s of the
# 126 s of `cargo test --workspace` on the owner's Mac unoptimized, and 52 s
# so. Their checks of overflow stay on, but for calamine's line above, and
# table_io is not optimized. The package is built with the release profile,
# which this does not change.
opt-level = 2
