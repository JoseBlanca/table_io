[package]
name = "table_io"
description = "Imports a table from a CSV, a TSV or the first visible sheet of an xlsx as typed columns, and exports typed columns as a CSV or an xlsx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Each format a feature, both on by default (docs/architecture.md, section
# 5): a build with `csv` alone compiles none of the dependencies of `xlsx`.
default = ["csv", "xlsx"]
csv = []
xlsx = ["dep:calamine", "dep:zip", "dep:quick-xml", "dep:rust_xlsxwriter"]

[dependencies]
# The version popnei_web's docs/technology.md measured. Its default features
# are none; chrono, for dates as chrono's types, and picture, for the images
# of a workbook, are left off: table_io writes a date from calamine's own
# parts of it.
calamine = { version = "=0.36.1", default-features = false, optional = true }
# The zip and the XML table_io reads itself before calamine ("What xlsx_rs
# reads before calamine" of docs/specs/read.md), at the versions and with
# the features calamine takes them, so that the package holds one copy of
# each. Upgraded with calamine.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "=0.41.0", features = ["encoding"], optional = true }
# The writer of the export of an xlsx, approved by the owner on 2 October
# 2026, with which the tests write their xlsx files in memory too. Its
# default features are none; `constant_memory`, which writes the sheet to
# a file of the file system as it goes, is left off, since the library
# uses no file system, so the sheet is held in memory until it is saved.
# It takes zip 8.6.0 with `deflate`, the copy and the features calamine
# takes.
rust_xlsxwriter = { version = "=0.99.1", default-features = false, optional = true }

[dev-dependencies]
# The same, for the tests of a build without `xlsx`, which write an xlsx in
# memory to see it refused or too large.
rust_xlsxwriter = { version = "=0.99.1", default-features = false }

[lints]
workspace = true
